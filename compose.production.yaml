name: sip-and-rate-production
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE:-sip_rate}
      MARIADB_USER: ${DB_USERNAME:-sip_rate}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - production_database:/var/lib/mysql
      - ./database_export/sip_rate.sql:/docker-entrypoint-initdb.d/01-sip-rate.sql:ro
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  web:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-sip_rate}
      DB_USERNAME: ${DB_USERNAME:-sip_rate}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SECURE_COOKIES: ${SECURE_COOKIES:-1}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - production_sessions:/var/lib/php/sessions
    restart: unless-stopped
volumes:
  production_database:
  production_sessions:
